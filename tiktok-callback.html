<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnuragOnAI Publisher: signing in</title><meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="site.css"></head><body>
<header class="top"><img class="logo" src="logo-256.png" alt="AnuragOnAI Publisher icon"><a class="brand" href="./">AnuragOnAI Publisher</a></header>
<main><h1 id="h">Signing you in…</h1><p id="m" class="muted">Finishing the TikTok sign-in.</p><p id="a"></p></main>
<script>
(async () => {
  const API = "https://aoai-publisher.46-202-92-251.sslip.io";
  const q = new URLSearchParams(location.search), state = q.get("state") || "";
  const h = document.getElementById("h"), m = document.getElementById("m"), a = document.getElementById("a");
  const back = '<a class="btn" href="publisher/">Back to AnuragOnAI Publisher</a>';
  // Sign-ins started from the web app carry an "aoai_" state; any other redirect (owner's command-line tools) just shows "Connected".
  if (!state.startsWith("aoai_")) { h.textContent = "Connected"; m.textContent = "You can close this tab and go back to the assistant."; return; }
  if (q.get("error")) {
    h.textContent = "Sign-in cancelled";
    m.textContent = q.get("error") === "access_denied" ? "You did not authorize AnuragOnAI Publisher on TikTok." : "TikTok returned: " + (q.get("error_description") || q.get("error"));
    a.innerHTML = back; return;
  }
  history.replaceState(null, "", location.pathname);   // keep the one-time code out of history
  try {
    const r = await fetch(API + "/api/auth/finish", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code: q.get("code"), state})});
    const j = await r.json();
    if (!r.ok || !j.sid) throw new Error((j.error && j.error.message) || "Sign-in failed.");
    localStorage.setItem("aoai_sid", j.sid);
    location.replace("publisher/");
  } catch (e) { h.textContent = "Sign-in failed"; m.textContent = e.message; a.innerHTML = back; }
})();
</script></body></html>
